name: Codex build Testbox

on:
  workflow_dispatch:
    inputs:
      testbox_id:
        description: Blacksmith Testbox session ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 240
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "16"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: useblacksmith/begin-testbox@233448af4bfdc6fca509a7f0974411ac6d8a8043 # v2
        with:
          testbox_id: ${{ inputs.testbox_id }}
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          packages=(binutils pkg-config libcap-dev time sccache)
          pinned=()
          for package in "${packages[@]}"; do
            version="$(apt-cache policy "$package" | awk '/Candidate:/ { print $2 }')"
            test -n "$version" && test "$version" != '(none)'
            pinned+=("$package=$version")
          done
          sudo apt-get install -y --no-install-recommends "${pinned[@]}"
          dpkg-query -W "${packages[@]}"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy, rustfmt, rust-src
      - name: Mount persistent sccache disk
        uses: useblacksmith/stickydisk@2b6822bdbe9c20b2541e9003aefa49e819b3467b # v1
        with:
          key: codex-build-sccache-v1
          path: /mnt/codex-sccache
      - name: Prepare build benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$HOME/.cache/codex-testbox/target"
          cache_dir="/mnt/codex-sccache"
          mountpoint -q "$cache_dir"
          mkdir -p "$target_dir" "$cache_dir" "$HOME/.cargo"
          test ! -e "$HOME/.cargo/config.toml"
          cat > "$HOME/.cargo/config.toml" <<EOF
          [build]
          jobs = 16
          target-dir = "$target_dir"
          rustc-wrapper = "/usr/bin/sccache"

          [env]
          CARGO_INCREMENTAL = "0"
          SCCACHE_DIR = "$cache_dir"
          SCCACHE_CACHE_SIZE = "20G"
          EOF
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
          sccache --version
          cd codex-rs
          cargo fetch --locked
          rustc -Vv
          cargo -V
          lscpu
          free -h
          df -h . "$target_dir" "$cache_dir"
      - uses: useblacksmith/run-testbox@5ca05834db1d3813554d1dd109e5f2087a8d7cbc # v2
