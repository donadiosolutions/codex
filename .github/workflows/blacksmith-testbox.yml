name: Fedora Codex build benchmark

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Sticky disk key (use a new key for cold, reuse it for hot)
        required: true
        default: codex-fedora44-build-v2
        type: string
      cache_state:
        description: Label for the benchmark result
        required: true
        default: cold
        type: choice
        options:
          - cold
          - hot

permissions:
  contents: read

concurrency:
  group: fedora-build-${{ inputs.cache_key }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 240
    env:
      BENCHMARK_PHASE: ${{ inputs.cache_state }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Mount persistent build inputs
        uses: useblacksmith/stickydisk@2b6822bdbe9c20b2541e9003aefa49e819b3467b # v1
        with:
          key: ${{ inputs.cache_key }}
          path: /mnt/codex-build-cache
          commit: "true"
      # Post actions run in reverse registration order: clean target, then snapshot.
      - name: Register post-job target cleanup
        uses: ./.github/actions/fedora-benchmark-cleanup
      - name: Build and measure Fedora binaries
        run: bash .github/scripts/fedora-build-benchmark.sh
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fedora44-${{ inputs.cache_state }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fedora-benchmark/*.json
            ${{ runner.temp }}/fedora-benchmark/*.txt
            ${{ runner.temp }}/fedora-benchmark/*.log
            ${{ runner.temp }}/fedora-benchmark/cargo-timings/
          if-no-files-found: error
