name: Fedora GNU release
run-name: Fedora GNU release ${{ inputs.release_tag }} from ${{ inputs.gitref }}

on:
  workflow_dispatch:
    inputs:
      gitref:
        description: Source commit or tag (fork first, then openai/codex)
        required: true
        type: string
      release_tag:
        description: Output tag and release title (bare tag name)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fedora-build-codex-fedora44-release-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 240
    outputs:
      source_repository: ${{ steps.source.outputs.repository }}
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check release inputs and credential configuration
        env:
          GITREF: ${{ inputs.gitref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TOKEN_CONFIGURED: ${{ secrets.CODEX_RELEASE_TOKEN != '' }}
        run: |
          set -euo pipefail
          test -n "$GITREF"
          [[ "$RELEASE_TAG" != refs/* ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if [[ "$TOKEN_CONFIGURED" != true ]]; then
            echo '::error::Configure CODEX_RELEASE_TOKEN with Contents and Workflows write access to this repository.'
            exit 1
          fi

      - name: Resolve the source to an immutable commit
        id: source
        env:
          GITREF: ${{ inputs.gitref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          encoded_ref="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$GITREF")"
          response="$RUNNER_TEMP/fedora-source.json"
          for repository in donadiosolutions/codex openai/codex; do
            status="$(curl --silent --show-error --retry 2 --max-time 60 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --output "$response" --write-out '%{http_code}' \
              "https://api.github.com/repos/$repository/commits/$encoded_ref")"
            if [[ "$status" == 200 ]]; then
              commit="$(python3 -c 'import json, re, sys; sha = json.load(open(sys.argv[1]))["sha"]; assert re.fullmatch("[0-9a-f]{40}", sha); print(sha)' "$response")"
              printf 'repository=%s\ncommit=%s\n' "$repository" "$commit" >> "$GITHUB_OUTPUT"
              printf 'Source: %s at %s\n' "$repository" "$commit"
              exit 0
            fi
            # GitHub uses 422 for a missing commit/tag, as well as other errors.
            if [[ "$status" == 422 ]] && python3 -c \
              'import json, os, sys; sys.exit(json.load(open(sys.argv[1])).get("message") != "No commit found for SHA: " + os.environ["GITREF"])' "$response"; then
              continue
            fi
            if [[ "$status" != 404 ]]; then
              echo "::error::Source lookup in $repository failed with HTTP $status; refusing upstream fallback."
              exit 1
            fi
          done
          echo '::error::The source ref was not found in the fork or upstream.'
          exit 1

      - name: Reject an output tag at a different commit
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          if refs="$(git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"; then
            commit="$(awk '$2 ~ /\^\{\}$/ {print $1}' <<< "$refs")"
            if [[ -z "$commit" ]]; then commit="$(awk '{print $1}' <<< "$refs")"; fi
            if [[ "$commit" != "$SOURCE_COMMIT" ]]; then
              echo '::error::The output tag already points to a different source commit.'
              exit 1
            fi
          else
            status=$?
            [[ "$status" == 2 ]] || exit "$status"
          fi

      - name: Check out workflow helpers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check out the selected source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          path: source
          persist-credentials: false
      - name: Mount persistent build inputs
        uses: useblacksmith/stickydisk@2b6822bdbe9c20b2541e9003aefa49e819b3467b # v1
        with:
          key: codex-fedora44-release-v2
          path: /mnt/codex-build-cache
          commit: "true"
      # Post actions run in reverse order: remove target, then snapshot the disk.
      - name: Register post-job target cleanup
        uses: ./.github/actions/fedora-benchmark-cleanup
      - name: Build and compress Fedora GNU binaries
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_REPOSITORY: ${{ steps.source.outputs.repository }}
        run: bash .github/scripts/fedora-release-build.sh
      - name: Upload compressed release assets and notes
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fedora44-gnu-release
          path: |
            ${{ runner.temp }}/fedora-benchmark/dist/
            ${{ runner.temp }}/fedora-benchmark/release-notes.md
          compression-level: 0
          if-no-files-found: error
      - name: Upload build and cache evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fedora44-gnu-evidence
          path: |
            ${{ runner.temp }}/fedora-benchmark/*.json
            ${{ runner.temp }}/fedora-benchmark/*.txt
            ${{ runner.temp }}/fedora-benchmark/*.log
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fedora44-gnu-release
          path: release-artifacts
      - name: Verify downloaded checksums
        working-directory: release-artifacts/dist
        run: sha256sum --check SHA256SUMS
      - name: Check out source objects for the output tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ needs.build.outputs.source_repository }}
          ref: ${{ needs.build.outputs.source_commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Create or verify the output tag
        env:
          GH_TOKEN: ${{ secrets.CODEX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          if refs="$(git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"; then
            commit="$(awk '$2 ~ /\^\{\}$/ {print $1}' <<< "$refs")"
            if [[ -z "$commit" ]]; then commit="$(awk '{print $1}' <<< "$refs")"; fi
            if [[ "$commit" != "$SOURCE_COMMIT" ]]; then
              echo '::error::The output tag changed to a different source commit.'
              exit 1
            fi
          else
            status=$?
            [[ "$status" == 2 ]] || exit "$status"
            askpass="$(mktemp "$RUNNER_TEMP/fedora-release-askpass.XXXXXX")"
            trap 'unlink "$askpass"' EXIT
            cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          ASKPASS
            chmod 700 "$askpass"
            # No force: transfer upstream objects and create a lightweight tag.
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
              git -C source push "https://github.com/$GITHUB_REPOSITORY.git" \
              "$SOURCE_COMMIT:refs/tags/$RELEASE_TAG"
          fi
      - name: Preserve existing release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.CODEX_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Listing also includes drafts that the by-tag endpoint can omit.
          timeout --kill-after=5s 60s gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/existing-releases.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          pages = json.loads((temp / "existing-releases.json").read_text())
          matches = [r for page in pages for r in page if r["tag_name"] == os.environ["RELEASE_TAG"]]
          release = min(matches, key=lambda r: (r["draft"], r["id"])) if matches else {}
          (temp / "existing-release.json").write_text(json.dumps(release))
          values = {"exists": str(bool(release)).lower(), "id": str(release.get("id", "")),
                    "url": release.get("html_url", "")}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY
      - name: Publish the release
        if: steps.metadata.outputs.exists == 'false'
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.CODEX_RELEASE_TOKEN }}
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          body_path: release-artifacts/release-notes.md
          files: |
            release-artifacts/dist/codex-x86_64-unknown-linux-gnu.zst
            release-artifacts/dist/codex-code-mode-host-x86_64-unknown-linux-gnu.zst
            release-artifacts/dist/SHA256SUMS
          fail_on_unmatched_files: true
          overwrite_files: true
          preserve_order: true
          draft: false
          prerelease: false
          make_latest: "false"
      - name: Attach assets to the existing release
        if: steps.metadata.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.CODEX_RELEASE_TOKEN }}
        run: |
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" \
            release-artifacts/dist/codex-x86_64-unknown-linux-gnu.zst \
            release-artifacts/dist/codex-code-mode-host-x86_64-unknown-linux-gnu.zst \
            release-artifacts/dist/SHA256SUMS
      - name: Verify published source and asset digests
        env:
          GH_TOKEN: ${{ secrets.CODEX_RELEASE_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.id || steps.metadata.outputs.id }}
          RELEASE_URL: ${{ steps.release.outputs.url || steps.metadata.outputs.url }}
        run: |
          set -euo pipefail
          refs="$(git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          commit="$(awk '$2 ~ /\^\{\}$/ {print $1}' <<< "$refs")"
          if [[ -z "$commit" ]]; then commit="$(awk '{print $1}' <<< "$refs")"; fi
          test "$commit" = "$SOURCE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/published-release.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" > "$RUNNER_TEMP/published-assets.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          release = json.loads((temp / "published-release.json").read_text())
          assert release["tag_name"] == os.environ["RELEASE_TAG"]
          existing = json.loads((temp / "existing-release.json").read_text())
          if "id" in existing:
              for field in ("name", "body", "draft", "prerelease"):
                  assert release[field] == existing[field], f"Existing release {field} changed"
          else:
              assert not release["draft"]
          assets = [asset for page in json.loads((temp / "published-assets.json").read_text()) for asset in page]
          for name in ("codex-x86_64-unknown-linux-gnu.zst", "codex-code-mode-host-x86_64-unknown-linux-gnu.zst", "SHA256SUMS"):
              path = Path("release-artifacts/dist") / name
              matching = [asset for asset in assets if asset["name"] == name]
              assert len(matching) == 1, f"Expected one published asset: {name}"
              asset = matching[0]
              digest = "sha256:" + hashlib.file_digest(path.open("rb"), "sha256").hexdigest()
              assert asset["state"] == "uploaded" and asset["size"] == path.stat().st_size, name
              assert asset["digest"] == digest, f"Published digest mismatch: {name}"
              print(f"Verified {name}: {digest}")
          PY
          printf 'Release: %s\n\nSource commit: %s\n' "$RELEASE_URL" "$SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
